# Opcional: hospedar a aplicacao no Render (free tier) usando o banco Neon.
# Render > New > Blueprint > apontar para este repositorio.
services:
  - type: web
    name: treinoja
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # colar a connection string do Neon no painel
      - key: SECRET_KEY
        generateValue: true
      - key: SUPERADMIN_USER
        value: superadmin
      - key: SUPERADMIN_PASS
        sync: false
